[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rewardharness"
description = "Self-evolving agentic reward framework for image-editing evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "The RewardHarness Authors" },
]
keywords = ["reward-model", "image-editing", "agentic", "vlm", "rlhf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["dependencies", "version"]

[project.scripts]
rewardharness = "rewardharness.cli:main"

[project.urls]
Homepage = "https://rewardharness.com"
Repository = "https://github.com/TIGER-AI-Lab/RewardHarness"
Paper = "https://arxiv.org/abs/2605.08703"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
version = { attr = "rewardharness.__version__" }

[tool.setuptools.packages.find]
include = ["rewardharness*", "src*"]
exclude = ["tests*", "vanilla*", "examples*", "scripts*"]

[tool.setuptools.package-data]
rewardharness = [
  "resources/library/**/*.json",
  "resources/library/**/*.md",
  "resources/score_guidelines/*.md",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore:.*is deprecated; import from rewardharness instead:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["rewardharness"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["src/library_gemini_*", "src/library"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/*.py" = ["E402", "F401"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "^(vanilla|src)/"

[[tool.mypy.overrides]]
module = ["datasets.*", "google.*", "openai.*", "PIL.*", "yaml.*"]
ignore_missing_imports = true
